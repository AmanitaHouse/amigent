# the Amiga programs, cross-compiled with GCC 16 whenever their sources change;
# the released binaries stay vbcc's, these are for trying a change on a real Amiga
name: amiga

on:
  push:
    paths: ["src/native/amiga/**", ".github/workflows/amiga.yml"]
  pull_request:
    paths: ["src/native/amiga/**", ".github/workflows/amiga.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    container: amigadev/crosstools:m68k-amigaos@sha256:6d96ee62dfac1ca84d54b063b4cfbc82bc6bf0971d6f5200be848d8c2f5fceee
    steps:
      - uses: actions/checkout@v4
      - name: GCC 16 or newer
        run: |
          m68k-amigaos-gcc --version | head -1
          test "$(m68k-amigaos-gcc -dumpversion | cut -d. -f1)" -ge 16
      - name: build
        run: |
          mkdir -p out out-apollo-ci
          m68k-amigaos-gcc -O2 -m68020 -noixemul -s -o out/amigentd src/native/amiga/daemon/amigentd.c
          m68k-amigaos-gcc -O2 -m68000 -noixemul -s -o out/amigentd.000 src/native/amiga/daemon/amigentd.c
          m68k-amigaos-gcc -O2 -m68000 -noixemul -s -o out/amigent-status src/native/amiga/tools/amigent-status.c
          m68k-amigaos-gcc -O2 -m68000 -noixemul -s -o out/amigent-monitor src/native/amiga/tools/amigent-monitor.c
          # Compile-verify the Apollo daemon, 68000 probe and Apollo monitor with GCC 16
          # into out-apollo-ci/ only (never copied into src/amigent/amiga/bin/ or shipped
          # as release binaries). GCC 16 rejects -m68080, so CI overrides CPU_FLAG=-m68020;
          # Makefile.apollo keeps CPU_FLAG ?= -m68080 for ApolloCrossDev GCC 6.5.0 release
          # builds, and physical V4-SA acceptance remains separate.
          make -f src/native/amiga/Makefile.apollo PREFIX="${CROSS_ROOT:-/opt/m68k-amigaos}" CC=m68k-amigaos-gcc CPU_FLAG=-m68020 clean all
          cp build/apollo/amigentd.apollo build/apollo/amigent-apollo-probe build/apollo/amigent-monitor.apollo out-apollo-ci/
          ls -l out out-apollo-ci
      - name: validate built native binaries
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          HUNK = b"\x00\x00\x03\xf3"
          out = Path("out")
          apollo_out = Path("out-apollo-ci")

          for name in ("amigentd", "amigentd.000", "amigent-status", "amigent-monitor"):
              data = (out / name).read_bytes()
              assert len(data) > 0, f"{name} is empty"
              assert data.startswith(HUNK), f"{name} is not an Amiga Hunk executable"

          for name in ("amigentd.apollo", "amigent-apollo-probe", "amigent-monitor.apollo"):
              data = (apollo_out / name).read_bytes()
              assert len(data) > 0, f"{name} is empty"
              assert data.startswith(HUNK), f"{name} is not an Amiga Hunk executable"

          apollo = (apollo_out / "amigentd.apollo").read_bytes()
          for marker in (
              b"arne.audio 4.22",
              b"ApolloOS",
              b"that range includes Apollo registers that a read can change",
              b"tracepoints are not supported on this Apollo build yet",
              b"$VER: amigentd",
          ):
              assert marker in apollo, f"amigentd.apollo missing marker: {marker!r}"

          probe = (apollo_out / "amigent-apollo-probe").read_bytes()
          for marker in (b"ApolloOS", b"AmigaOS", b"68080"):
              assert marker in probe, f"amigent-apollo-probe missing marker: {marker!r}"
          assert b"arne.audio" not in probe

          monitor = (apollo_out / "amigent-monitor.apollo").read_bytes()
          assert b"$VER: amigent-monitor" in monitor

          # Confirm tracked packaged Apollo release binaries were not touched by CI compilation.
          packaged = {
              "amigentd.apollo": (132140, "0f1405a1d3494e1bebf6185030139c7858d5636a22cd565a8b432143c90c735d"),
              "amigent-apollo-probe": (3108, "ea78c8c508e2e3c12b719ac20ebf175a4805d34a3458e6a4882118ad417d2bb7"),
              "amigent-monitor.apollo": (22804, "e80c0456d63d435a57febd722caabdf7f1017c99985efa2e016d7f3c9a97bc96"),
          }
          bin_dir = Path("src/amigent/amiga/bin")
          for name, (size, digest) in packaged.items():
              data = (bin_dir / name).read_bytes()
              assert len(data) == size, f"packaged {name} size changed: {len(data)}"
              assert hashlib.sha256(data).hexdigest() == digest, f"packaged {name} sha256 changed"

          print("Validated 4 classic binaries in out/, 3 Apollo CI compile-check binaries in out-apollo-ci/, and 3 unchanged packaged Apollo binaries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: amiga-gcc
          path: out/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: apollo-gcc16-compile-check-ci-only
          path: out-apollo-ci/
          retention-days: 14
