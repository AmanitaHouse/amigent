<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Amigent</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="machines.css">
<link rel="stylesheet" href="fleet.css">
<script src="ui.js"></script>
</head>
<body class="fleet">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-chevron" viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></symbol>
  <symbol id="i-close" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></symbol>
  <symbol id="i-grid" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></symbol>
  <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></symbol>
</svg>
<header id="bar">
  <button id="machine" class="machine" type="button">
    <img src="icon.svg" alt="" width="28" height="28">
    <span class="machine-text">
      <span class="machine-line"><b id="machine-name" data-i18n="fleet_title">Your Amigas</b><i id="machine-dot" class="dot"></i></span>
      <span id="machine-sub" class="machine-sub"></span>
    </span>
    <svg class="chev"><use href="#i-chevron"/></svg>
  </button>
  <div class="center"></div>
  <div class="actions"></div>
</header>
<form id="run" class="runbar">
  <input id="command" autocomplete="off" spellcheck="false" data-i18n-aria="fleet_run_placeholder" data-i18n-placeholder="fleet_run_placeholder" placeholder="An AmigaDOS command for every Amiga, e.g. Version">
  <button id="run-go" class="primary" data-i18n="fleet_run">Run on all</button>
</form>
<section id="results" aria-live="polite" hidden></section>
<main id="tiles" aria-live="polite"></main>
<footer id="status"><span data-i18n="fleet_hint">Each Amiga is checked every 20 seconds.</span></footer>
<div id="notices"><div id="toasts" aria-live="polite"></div></div>
<script src="fleet.js"></script>
<script src="machines.js"></script>
</body>
</html>
